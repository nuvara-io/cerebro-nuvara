<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap">
<style>
  .stage { width: 1080px; height: 620px; box-sizing: border-box; padding: 64px 60px; position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 72px;
           background: linear-gradient(135deg, var(--redes-fondo-inicio) 0%, var(--redes-fondo-fin) 100%); font-family: Poppins, sans-serif; }
  .card { position: relative; padding: 2px; border-radius: 20px; background: linear-gradient(135deg, var(--gradient-03-start), var(--gradient-03-end)); }
  .inner { height: 100%; box-sizing: border-box; border-radius: 18px; background: var(--white); padding: 64px 36px 36px; display: flex; gap: 24px; }
  .head { position: absolute; top: -26px; left: 50%; translate: -50% 0; white-space: nowrap; padding: 12px 28px; border-radius: 12px;
          background: linear-gradient(135deg, var(--gradient-03-start), var(--gradient-03-end)); color: var(--white); font-size: 22px; font-weight: 700; letter-spacing: .02em; }
  .tile { width: 72px; height: 72px; flex: none; border-radius: 16px; background: linear-gradient(135deg, var(--gradient-03-start), var(--gradient-03-end)); display: grid; place-items: center; }
  .tile svg { width: 38px; height: 38px; fill: none; stroke: var(--white); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  ul { margin: 0; padding-left: 22px; font-size: 24px; line-height: 1.35; color: var(--redes-texto-cuerpo); }
  li b { color: var(--redes-texto-titulo); }
  .vs { position: absolute; left: 50%; top: 52%; translate: -50% -50%; width: 92px; height: 92px; border-radius: 50%; border: 6px solid var(--white);
        background: linear-gradient(135deg, var(--gradient-03-start), var(--gradient-03-end)); color: var(--white); font-size: 32px; font-weight: 700; font-style: italic;
        display: grid; place-items: center; box-shadow: var(--redes-sombra-tarjeta); }
</style>

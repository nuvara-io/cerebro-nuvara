<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,700;1,700&display=swap">
<style>
  .stage { width: 1080px; height: 460px; box-sizing: border-box; padding: 56px 76px; display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center;

  .block { padding: 32px 36px; border-radius: 12px; background: linear-gradient(135deg, var(--gradient-03-start) 0%, var(--gradient-03-end) 100%);

  .block b { font-weight: 700; }

  <div>
    <p class="t light">¿Tu sistema</p>

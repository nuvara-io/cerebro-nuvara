<!-- @dsCard group="Redes" width=1080 height=420 subtitle="Bold azul + Bold gris, o Bold + Light" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap">
<style>
  .stage { width: 1080px; height: 420px; box-sizing: border-box; padding: 56px 76px; display: grid; grid-template-columns: 1fr 1fr; gap: 48px;
           background: linear-gradient(135deg, var(--redes-fondo-inicio) 0%, var(--redes-fondo-fin) 100%); font-family: Poppins, sans-serif; }
  .t { margin: 0; font-size: 64px; line-height: 1.05; letter-spacing: -0.01em; }
  .b { font-weight: 700; }
  .l { font-weight: 300; }
  .azul { color: var(--redes-azul); }
  .gris { color: var(--redes-texto-titulo); }
  .cap { margin: 20px 0 0; font-size: 18px; color: var(--redes-texto-cuerpo); }
</style>
<div class="stage">
  <div>
    <p class="t b azul">La contabilidad</p>
    <p class="t b gris">no es una receta.</p>
    <p class="cap">Dos tonos: Bold azul + Bold gris</p>
  </div>
  <div>
    <p class="t b azul">Suspensión</p>
    <p class="t l azul">de actividades</p>
    <p class="cap">Dos pesos: Bold + Light, todo azul</p>
  </div>
</div>

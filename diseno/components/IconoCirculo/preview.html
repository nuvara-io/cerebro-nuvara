<!-- @dsCard group="Redes" width=1080 height=420 subtitle="Ícono Lucide en círculo azul + texto con palabra clave en Bold" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap">
<style>
  .stage { width: 1080px; height: 420px; box-sizing: border-box; padding: 64px 76px; display: grid; gap: 40px; align-content: start;
           background: linear-gradient(135deg, var(--redes-fondo-inicio) 0%, var(--redes-fondo-fin) 100%); font-family: Poppins, sans-serif; }
  .row { display: flex; align-items: center; gap: 32px; }
  .dot { width: 88px; height: 88px; flex: none; border-radius: 50%; background: var(--redes-azul); display: grid; place-items: center; }
  .dot svg { width: 42px; height: 42px; fill: none; stroke: var(--white); stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
  .txt { margin: 0; font-size: 30px; line-height: 1.3; color: var(--redes-texto-cuerpo); max-width: 520px; }
  .txt strong { font-weight: 700; color: var(--redes-azul); }
  .txt b { font-weight: 700; color: var(--redes-texto-titulo); }
</style>
<div class="stage">
  <div class="row">
    <div class="dot"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
    <p class="txt">La tecnología no debería imponer una <b>única forma de trabajar.</b></p>
  </div>
  <div class="row">
    <div class="dot"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></div>
    <p class="txt">Debería <strong>respetar la tuya.</strong></p>
  </div>
</div>

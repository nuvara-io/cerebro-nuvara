<!-- @dsCard group="Redes" width=1200 height=628 subtitle="Pieza de LinkedIn 1200×628 con arco de marca" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap">
<style>
  .li { position: relative; width: 1200px; height: 628px; overflow: hidden; font-family: Poppins, sans-serif;
        background: linear-gradient(135deg, var(--redes-fondo-inicio) 0%, var(--redes-fondo-fin) 100%); }
  .arc { position: absolute; width: 420px; height: 420px; right: -150px; bottom: -190px; border-radius: 50%; padding: 34px; box-sizing: border-box;
         background: conic-gradient(from 200deg, var(--gradient-03-start), var(--gradient-03-end), var(--gradient-03-start));
         -webkit-mask: radial-gradient(circle, transparent 176px, #000 178px); mask: radial-gradient(circle, transparent 176px, #000 178px); }
  .copy { position: absolute; left: 96px; top: 50%; translate: 0 -50%; width: 520px; }
  .copy p { margin: 0; font-size: 34px; line-height: 1.25; color: var(--redes-azul); font-weight: 300; }
  .copy b { font-weight: 700; }
  .copy .sub { margin-top: 18px; font-size: 20px; color: var(--redes-texto-titulo); font-weight: 400; }
  .copy .box { display: inline-block; margin-top: 24px; padding: 10px 22px; border: 2px solid var(--redes-azul); border-radius: 12px; font-size: 20px; color: var(--redes-azul); }
  .tip { position: absolute; right: 120px; top: 50%; translate: 0 -50%; font-size: 168px; font-weight: 700; color: var(--redes-azul); letter-spacing: -0.02em; }
</style>
<div class="li">
  <div class="arc"></div>
  <div class="copy">
    <p>No <b>causes</b> sin entender<br>el <b>documento.</b></p>
    <p class="sub">Antes de registrar, asegúrate de identificar:</p>
    <span class="box">Qué se está comprando o vendiendo realmente</span>
  </div>
  <span class="tip">Tip 1</span>
</div>
